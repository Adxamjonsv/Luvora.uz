<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Luvora</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    /* Telegram temasига moslashadi: qora tema -> qora, oq tema -> oq */
    --bg:var(--tg-theme-bg-color,#0c0c0f);
    --card:var(--tg-theme-secondary-bg-color,#16161b);
    --card2:var(--tg-theme-secondary-bg-color,#1e1e24);
    --text:var(--tg-theme-text-color,#f5f5f7);
    --muted:var(--tg-theme-hint-color,#8b8b93);
    --line:rgba(128,128,128,.18);
    --gold:#e3b26b; --gold2:#c9973f;
    --like:#ff5c78; --nope:#3a3a42; --gift:#e3b26b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;}
  #app{height:100dvh;display:flex;flex-direction:column;}
  .topbar{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 0 8px;font-weight:800;font-size:18px;}
  .topbar .heart{color:var(--gold);}
  main{flex:1;position:relative;overflow:hidden;}
  .page{position:absolute;inset:0;overflow-y:auto;display:none;}
  .page.on{display:block;}
  .empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted);gap:14px;padding:40px 30px;}
  .empty .em{font-size:56px;}
  .gbtn{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#1a1206;border:none;border-radius:16px;padding:15px 24px;font-size:16px;font-weight:800;cursor:pointer;}
  .center{height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);}

  /* ---- DISCOVER: to'liq ekran karta ---- */
  #deck{position:absolute;inset:0;}
  .card{position:absolute;inset:0;border-radius:0;overflow:hidden;background:#000;will-change:transform;}
  .card .photo{position:absolute;inset:0;background-size:cover;background-position:center;background-color:#1a1a1f;}
  .card .grad{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.95) 0%,rgba(0,0,0,.75) 22%,rgba(0,0,0,.35) 44%,rgba(0,0,0,.08) 60%,rgba(0,0,0,0) 74%);}
  .card .dots{position:absolute;top:10px;left:14px;right:14px;display:flex;gap:5px;z-index:3;}
  .card .dots i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.3);}
  .card .dots i.on{background:#fff;}
  .card .tools{position:absolute;top:22px;right:14px;display:flex;flex-direction:column;gap:12px;z-index:3;}
  .card .tools button{width:44px;height:44px;border-radius:50%;border:none;background:rgba(20,20,24,.7);color:#fff;font-size:18px;cursor:pointer;backdrop-filter:blur(6px);}
  .taphint{position:absolute;top:0;bottom:150px;width:40%;z-index:2;}
  .taphint.l{left:0;} .taphint.r{right:0;}
  .stamp{position:absolute;top:70px;padding:6px 16px;border:3px solid;border-radius:12px;font-weight:800;font-size:28px;text-transform:uppercase;opacity:0;z-index:3;}
  .stamp.like{left:22px;color:var(--like);border-color:var(--like);transform:rotate(-16deg);}
  .stamp.nope{right:22px;color:#fff;border-color:#fff;transform:rotate(16deg);}
  .card .info{position:absolute;left:0;right:0;bottom:120px;padding:0 20px;z-index:3;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.75);}
  .card .info h2{margin:0;font-size:30px;font-weight:800;display:flex;align-items:baseline;gap:10px;}
  .card .info h2 b{font-weight:800;} .card .info h2 span{font-size:24px;font-weight:600;}
  .card .info .loc{margin-top:6px;font-size:15px;opacity:.9;display:flex;align-items:center;gap:5px;}
  .card .info .tags{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;}
  .card .info .tags span{background:rgba(30,30,36,.85);padding:8px 14px;border-radius:20px;font-size:13px;backdrop-filter:blur(4px);}
  .card .info .about{margin-top:10px;font-size:14px;opacity:.9;max-height:60px;overflow:hidden;}
  .swipebtns{position:absolute;left:0;right:0;bottom:34px;display:flex;align-items:center;justify-content:center;gap:14px;z-index:4;}
  .sb{border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.5);transition:transform .12s;}
  .sb.rew{width:48px;height:48px;background:#26262c;color:#f5c518;font-size:22px;}
  .sb.super{width:56px;height:56px;background:#4aa8ff;color:#fff;font-size:24px;}
  .sb:active{transform:scale(.88);}
  .sb.no{width:56px;height:56px;background:#26262c;color:#fff;font-size:24px;}
  .sb.gift{width:50px;height:50px;background:linear-gradient(180deg,var(--gold),var(--gold2));color:#1a1206;font-size:22px;}
  .sb.yes{width:62px;height:62px;background:var(--like);color:#fff;font-size:28px;}

  /* ---- Ro'yxatlar (Layklar/Chatlar) ---- */
  .hd{padding:14px 18px 6px;font-size:22px;font-weight:800;}
  .sub{padding:0 18px 10px;color:var(--muted);font-size:14px;}
  .banner{margin:8px 16px;background:var(--card);border-radius:16px;padding:16px;text-align:center;}
  .banner b{font-size:16px;} .banner p{color:var(--muted);font-size:13px;margin:6px 0 12px;}
  .lgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:8px 16px 90px;}
  .lcard{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:3/4;background:#1a1a1f;}
  .lcard .ph{position:absolute;inset:0;background-size:cover;background-position:center;}
  .lcard .gr{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.8),transparent 55%);}
  .lcard .nm{position:absolute;left:10px;bottom:52px;font-weight:700;font-size:15px;z-index:2;}
  .lcard .ph.locked{filter:blur(18px) brightness(.85);transform:scale(1.15);}
  .lcard .lockov{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;border:2px solid var(--gold);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:22px;background:rgba(0,0,0,.35);z-index:2;}
  .lcard .acts{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:8px;z-index:2;}
  .lcard .acts button{flex:1;height:40px;border:none;border-radius:12px;font-size:18px;cursor:pointer;}
  .lcard .acts .n{background:rgba(20,20,24,.85);color:#fff;} .lcard .acts .y{background:var(--like);color:#fff;}

  .crow{display:flex;align-items:center;gap:12px;margin:0 16px 12px;background:var(--card);border-radius:16px;padding:12px;cursor:pointer;}
  .crow .av{width:58px;height:58px;border-radius:50%;background-size:cover;background-position:center;background-color:#333;flex:none;}
  .crow .t{flex:1;min-width:0;} .crow .t b{font-size:16px;} .crow .t .m{color:var(--muted);font-size:13px;margin-top:2px;}
  .crow .go{width:40px;height:40px;border-radius:50%;background:#2a72e0;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;}

  /* ---- Profil ---- */
  .pf{padding:16px 16px 90px;}
  .pf .avatar{width:118px;height:118px;border-radius:50%;background-size:cover;background-position:center;background-color:#333;margin:6px auto;box-shadow:0 8px 30px rgba(0,0,0,.5);}
  .pf .nm{text-align:center;font-size:22px;font-weight:800;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:6px;}
  .pf .nm .v{color:var(--gold);} .pf .city{text-align:center;color:var(--muted);margin-top:2px;}
  .stats{display:flex;background:var(--card);border-radius:16px;margin:16px 0;padding:16px 0;}
  .stats div{flex:1;text-align:center;} .stats b{display:block;font-size:22px;color:var(--gold);font-weight:800;} .stats span{font-size:12px;color:var(--muted);}
  .prog{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:12px;}
  .prog .r{display:flex;justify-content:space-between;font-size:14px;margin-bottom:10px;} .prog .r b{color:var(--gold);}
  .bar{height:8px;border-radius:8px;background:#2a2a30;overflow:hidden;} .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:8px;}
  .rowc{background:var(--card);border-radius:16px;margin-bottom:12px;overflow:hidden;}
  .item{display:flex;align-items:center;gap:12px;padding:16px;cursor:pointer;border-bottom:1px solid var(--line);}
  .item:last-child{border-bottom:none;}
  .item .ic{width:38px;height:38px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--gold);flex:none;}
  .item .tt{flex:1;} .item .tt b{font-size:15px;} .item .tt small{color:var(--muted);display:block;font-size:12px;margin-top:1px;}
  .item .rt{color:var(--muted);}
  .sw{width:50px;height:30px;border-radius:16px;background:#3a3a42;position:relative;transition:.2s;flex:none;}
  .sw.on{background:var(--gold);} .sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;}
  .sw.on i{left:23px;}
  .langsel{display:flex;gap:6px;flex:none;}
  .lgb{background:#3a3a42;color:var(--muted);border:none;border-radius:10px;padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer;}
  .lgb.on{background:var(--gold);color:#1a1204;}
  .badge-ok{margin:0 16px 12px;background:var(--card);border-radius:14px;padding:14px;text-align:center;color:var(--gold);font-weight:700;}
  .del{display:block;text-align:center;color:var(--muted);text-decoration:underline;margin:18px auto;background:none;border:none;font-size:14px;cursor:pointer;}

  /* ---- pastki nav ---- */
  nav{display:flex;border-top:1px solid var(--line);background:var(--bg);}
  nav button{flex:1;background:none;border:none;color:var(--muted);padding:9px 0 12px;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;}
  nav button .ic{font-size:21px;} nav button.on{color:var(--gold);}
  nav .nb{position:absolute;top:4px;left:50%;margin-left:6px;background:var(--like);color:#fff;border-radius:10px;font-size:10px;padding:0 5px;font-weight:700;}

  /* ---- Match overlay ---- */
  .match{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:50;text-align:center;padding:30px;}
  .match.on{display:flex;} .match h1{font-size:34px;background:linear-gradient(90deg,var(--gold),#ff8fa8);-webkit-background-clip:text;background-clip:text;color:transparent;}

  /* ---- Ro'yxatdan o'tish sehrgari ---- */
  .wz{position:fixed;inset:0;background:var(--bg);z-index:45;display:none;flex-direction:column;}
  .wz.on{display:flex;}
  .wz .pbar{height:4px;background:var(--card);} .wz .pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));transition:.3s;box-shadow:0 0 10px var(--gold);}
  .wz .body{flex:1;overflow-y:auto;padding:30px 22px;}
  .wz h2{font-size:29px;font-weight:800;margin:4px 0 8px;line-height:1.15;}
  .wz .hint{color:var(--muted);font-size:15px;margin:0 0 26px;}
  .wz .inp{width:100%;background:var(--card);border:none;border-radius:16px;padding:18px;color:var(--text);font-size:17px;outline:none;}
  .wz textarea.inp{resize:none;min-height:110px;}
  .wz select.inp{appearance:none;background-image:none;}
  .opt{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid transparent;border-radius:16px;padding:16px 18px;margin-bottom:12px;cursor:pointer;font-size:16px;font-weight:600;}
  .opt.sel{border-color:var(--gold);}
  .opt .ic{color:var(--gold);font-size:20px;width:24px;text-align:center;}
  .opt .rd{margin-left:auto;width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);}
  .opt.sel .rd{border-color:var(--gold);background:radial-gradient(circle,var(--gold) 45%,transparent 50%);}
  .gsel{display:flex;gap:12px;} .gsel .opt{flex:1;justify-content:center;}
  .photos{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:8px;}
  .pslot{position:relative;aspect-ratio:3/4;border-radius:14px;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--muted);overflow:hidden;background:var(--card);cursor:pointer;}
  .pslot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .pslot .rm{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;border:none;font-size:14px;z-index:2;cursor:pointer;}
  .pslot .main{position:absolute;bottom:0;left:0;right:0;background:var(--gold);color:#1a1206;font-size:10px;font-weight:800;text-align:center;padding:2px;}
  .wz .foot{display:flex;gap:12px;padding:14px 22px;border-top:1px solid var(--line);}
  .wz .foot .back{background:var(--card);color:var(--text);border:none;border-radius:16px;padding:15px 20px;font-weight:700;cursor:pointer;}
  .wz .foot .next{flex:1;}

  /* ---- Suhbat (chat) ---- */
  .chatv{position:fixed;inset:0;background:var(--bg);z-index:46;display:none;flex-direction:column;}
  .chatv.on{display:flex;}
  .chatv .hd2{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);}
  .chatv .hd2 .bk{background:none;border:none;color:var(--text);font-size:26px;cursor:pointer;line-height:1;}
  .chatv .hd2 .av{width:40px;height:40px;border-radius:50%;background-size:cover;background-position:center;background-color:#333;flex:none;}
  .chatv .hd2 b{font-size:16px;}
  .msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;}
  .msg{max-width:80%;padding:10px 14px;border-radius:16px;font-size:15px;word-break:break-word;}
  .msg.me{align-self:flex-end;background:linear-gradient(180deg,var(--gold),var(--gold2));color:#1a1206;border-bottom-right-radius:5px;}
  .msg.you{align-self:flex-start;background:var(--card);color:var(--text);border-bottom-left-radius:5px;}
  .msgs .empty2{margin:auto;color:var(--muted);text-align:center;line-height:1.5;}
  .cin{display:flex;gap:10px;padding:10px 12px;border-top:1px solid var(--line);}
  .cin input{flex:1;background:var(--card);border:none;border-radius:22px;padding:13px 18px;color:var(--text);outline:none;font-size:15px;}
  .cin button{width:46px;height:46px;border-radius:50%;border:none;background:linear-gradient(180deg,var(--gold),var(--gold2));color:#1a1206;font-size:18px;cursor:pointer;flex:none;}

  /* ---- Bottom sheet (Premium/Boost) ---- */
  .sheet{position:fixed;inset:0;z-index:48;display:none;}
  .sheet.on{display:block;}
  #pickerSheet{z-index:49;}
  .sheet .bg{position:absolute;inset:0;background:rgba(0,0,0,.6);}
  .sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:94%;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:8px 20px 22px;animation:up .25s ease;}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  .grip{width:44px;height:5px;border-radius:3px;background:var(--muted);opacity:.4;margin:6px auto 14px;}
  .crown{text-align:center;font-size:38px;color:var(--gold);line-height:1;}
  .sheet h1{text-align:center;font-size:27px;font-weight:800;margin:8px 0 2px;color:var(--gold);}
  .sublt{text-align:center;color:var(--muted);margin-bottom:18px;}
  .feat{background:var(--card);border-radius:18px;padding:2px 16px;margin-bottom:18px;}
  .feat .f{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);}
  .feat .f:last-child{border-bottom:none;}
  .feat .f .ic{color:var(--gold);font-size:20px;width:24px;flex:none;text-align:center;}
  .feat .f b{font-size:16px;} .feat .f small{color:var(--muted);display:block;font-size:13px;margin-top:3px;line-height:1.35;}
  .plans{display:flex;gap:10px;margin-bottom:18px;}
  .plan{flex:1;background:var(--card);border:2px solid transparent;border-radius:16px;padding:14px 4px;text-align:center;cursor:pointer;position:relative;}
  .plan.sel{border-color:var(--gold);}
  .plan b{display:block;font-size:16px;} .plan span{color:var(--muted);font-size:13px;}
  .plan .bdg{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--gold);color:#1a1206;font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px;white-space:nowrap;}
  .pay{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:16px;margin-bottom:10px;cursor:pointer;position:relative;}
  .pay.best{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#1a1206;}
  .pay .nm{font-weight:800;font-size:16px;flex:1;} .pay .pr{text-align:right;} .pay .pr b{font-size:16px;} .pay .pr small{display:block;font-size:11px;opacity:.85;}
  .pay .bb{position:absolute;top:-9px;right:14px;background:#141418;color:var(--gold);font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px;}
  .notnow{display:block;width:100%;text-align:center;color:var(--muted);background:none;border:none;padding:14px;margin-top:4px;font-size:15px;cursor:pointer;}
  .boostopt{display:flex;gap:12px;margin:18px 0;}
  .boostopt .o{flex:1;background:var(--card);border:2px solid transparent;border-radius:16px;padding:18px 8px;text-align:center;cursor:pointer;position:relative;}
  .boostopt .o.sel{border-color:var(--gold);}
  .boostopt .o .ic{font-size:22px;} .boostopt .o .h{margin-top:8px;font-weight:600;} .boostopt .o .st{color:var(--gold);font-weight:800;font-size:18px;margin-top:4px;} .boostopt .o .sm{color:var(--muted);font-size:12px;}
  .boostopt .o .bdg{position:absolute;top:-9px;right:8px;background:#2ecc71;color:#06210f;font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px;}

  /* ---- Profil tahrirlash ---- */
  .editv{position:fixed;inset:0;background:var(--bg);z-index:47;display:none;flex-direction:column;}
  .editv.on{display:flex;}
  .eh{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);}
  .eh .bk{background:none;border:none;color:var(--text);font-size:24px;cursor:pointer;line-height:1;}
  .eh b{font-size:18px;}
  .ebody{flex:1;overflow-y:auto;padding:14px 16px 96px;}
  .eprog .r{display:flex;justify-content:space-between;font-size:13px;color:var(--gold);margin-bottom:8px;font-weight:600;}
  .sec{color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.6px;margin:22px 0 10px;text-transform:uppercase;}
  .sec .pct{color:var(--gold);background:rgba(227,178,107,.15);padding:1px 7px;border-radius:8px;margin-left:6px;font-size:11px;}
  .ephotos{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .epslot{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--card);border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:28px;cursor:pointer;}
  .epslot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .epslot.filled{border-style:solid;border-color:transparent;}
  .epslot .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;border:none;font-size:13px;z-index:2;cursor:pointer;}
  .epslot .main{position:absolute;bottom:0;left:0;right:0;background:var(--gold);color:#1a1206;font-size:10px;font-weight:800;text-align:center;padding:2px;}
  .epslot .num{position:absolute;top:4px;left:6px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;border-radius:8px;padding:0 6px;z-index:2;}
  .hint2{color:var(--muted);font-size:12px;margin:6px 2px 2px;line-height:1.4;}
  .fld{margin-bottom:10px;}
  .fld label{display:block;color:var(--muted);font-size:12px;margin:0 2px 6px;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:8px 14px;font-size:14px;cursor:pointer;}
  .chip.on{background:rgba(227,178,107,.15);border-color:var(--gold);color:var(--gold);}
  .rng{display:flex;align-items:center;gap:10px;margin:8px 2px;} .rng input[type=range]{flex:1;accent-color:var(--gold);}
  .rng .lab{font-size:13px;color:var(--muted);min-width:26px;text-align:center;}
  .esave{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 16px;background:linear-gradient(to top,var(--bg) 72%,transparent);}
  .erow{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:15px 16px;margin-bottom:10px;cursor:pointer;transition:transform .1s;}
  .erow:active{transform:scale(.99);}
  .erow .ei{color:var(--gold);width:22px;text-align:center;font-size:17px;flex:none;}

function compressImage(file){
  return new Promise(resolve=>{
    try{
      const url=URL.createObjectURL(file);
      const img=new Image();
      img.onload=()=>{
        try{
          const MAX=1280;let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
          if(!w||!h){URL.revokeObjectURL(url);return resolve(file);}
          if(w>h&&w>MAX){h=Math.round(h*MAX/w);w=MAX;}
          else if(h>=w&&h>MAX){w=Math.round(w*MAX/h);h=MAX;}
          const c=document.createElement('canvas');c.width=w;c.height=h;
          c.getContext('2d').drawImage(img,0,0,w,h);
          URL.revokeObjectURL(url);
          c.toBlob(b=>resolve(b&&b.size?b:file),'image/jpeg',0.82);
        }catch(_){URL.revokeObjectURL(url);resolve(file);}
      };
      img.onerror=()=>{URL.revokeObjectURL(url);resolve(file);};
      img.src=url;
    }catch(_){resolve(file);}
  });
}
async function uploadPhoto(file){
  const blob=await compressImage(file);
  const fd=new FormData();fd.append("file",blob,"photo.jpg");
  const r=await fetch('/api/upload',{method:'POST',headers:{"X-Init-Data":INIT},body:fd});
  let j={};try{j=await r.json();}catch(_){}
  if(!j.url) throw new Error(j.error||('HTTP '+r.status));
  return j.url;
}

function renderDeck(){
  const deck=document.getElementById('deck');

  if(!feed.length){state(deck,'🙌',tr('nomore'),null,null,tr('later'));return;}

function attachTap(card,p){

function attachSwipe(card,p){
  let sx=0,dx=0,dy=0,drag=false;
  const like=card.querySelector('.stamp.like'),nope=card.querySelector('.stamp.nope');
  const dn=e=>{drag=true;const t=e.touches?e.touches[0]:e;sx=t.clientX;card.style.transition='none';};
  const mv=e=>{if(!drag)return;const t=e.touches?e.touches[0]:e;dx=t.clientX-sx;dy=(e.touches?e.touches[0]:e).clientY;
    card.style.transform=`translateX(${dx}px) rotate(${dx/22}deg)`;like.style.opacity=Math.max(0,dx/110);nope.style.opacity=Math.max(0,-dx/110);};
  const up=()=>{if(!drag)return;drag=false;card.style.transition='transform .3s';
    if(Math.abs(dx)>110)finish(dx>0?'like':'nope');else{card.style.transform='';like.style.opacity=0;nope.style.opacity=0;}dx=0;};
  card.addEventListener('touchstart',dn,{passive:true});card.addEventListener('touchmove',mv,{passive:true});card.addEventListener('touchend',up);
  card.addEventListener('mousedown',dn);window.addEventListener('mousemove',mv);window.addEventListener('mouseup',up);
}
async function finish(dir){

    box.innerHTML=`<div class="empty2">Suhbatni boshlang 👋<br>${esc(chatName)} bilan yozishing mumkin.</div>`;

  else if(s==='photos'){h=`<h2>Foto qo'shing</h2><p class="hint">Eng yaxshi suratlaringizni qo'shing. Yuzsiz suratlar va memlar moderatsiyadan o'tmaydi. (${W.photos.length}/6)</p>

function wzSyncText(){const n=document.getElementById('w_name');if(n)W.name=n.value;const a=document.getElementById('w_about');if(a)W.about=a.value;}

document.getElementById('wzfile').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  const nx=document.getElementById('wznext');const old=nx.textContent;nx.textContent="Yuklanmoqda...";nx.disabled=true;
  try{
    const url=await uploadPhoto(f);
    if(photoTarget>=0&&photoTarget<W.photos.length)W.photos[photoTarget]=url;else W.photos.push(url);
  }catch(err){toast("Rasm yuklanmadi: "+err.message);}
  nx.textContent=old;nx.disabled=false;renderWz();
});
function saveStep(){
  const s=STEPS[W.step];
  if(s==='name'){const el=document.getElementById('w_name');const v=el?el.value.trim():'';if(v.length<2){alert("Ismingizni yozing");return false;}W.name=v;}
  if(s==='age'){if(!W.age){alert("Tug'ilgan yilni tanlang");return false;}}
  if(s==='gender'){if(!W.gender){alert("Jinsni tanlang");return false;}}
  if(s==='goal'){if(!W.goal){alert("Maqsadni tanlang");return false;}}
  if(s==='city'){const a=document.getElementById('w_about');if(a)W.about=a.value.trim();}
  if(s==='photos'){if(!W.photos.length){alert("Kamida bitta foto qo'shing");return false;}}
  return true;
}
function wzPrev(){if(W.step>0){wzSyncText();W.step--;renderWz();}}
async function wzNext(){
  if(!saveStep())return;
  if(W.step<STEPS.length-1){W.step++;renderWz();return;}
  const nx=document.getElementById('wznext');nx.textContent="Yuborilmoqda...";nx.disabled=true;
  const r=await api('/api/register',{method:'POST',body:JSON.stringify({name:W.name,age:W.age,gender:W.gender,goal:W.goal,city:W.city,about:W.about,photos:W.photos})});
  nx.disabled=false;nx.textContent="Anketa yaratish";
  if(r&&r.ok){hideWizard();loadFeed();refreshBadge();}
  else alert("Xato: "+(r&&r.error||"qayta urining"));
}

  ["⚡","Lentada ustuvorlik","Sizni boshqa foydalanuvchilardan oldin ko'radilar"],
  ["➤","Telegramga o'tish","Foydalanuvchida @username mavjud bo'lsa"],
];
let pplan='30';
function fmt(n){return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g," ");}
function openPremium(){document.getElementById('premiumSheet').classList.add('on');renderPremium();}
function renderPremium(){
  const p=PPLANS.find(x=>x.id===pplan);const perday=Math.round(p.som/p.days);
  document.getElementById('premiumPanel').innerHTML=`
    <div class="grip"></div><div class="crown">♔</div>
    <h1>Luvora Premium</h1><div class="sublt">Cheklovsiz tanishing</div>
    <div class="feat">${PFEATS.map(f=>`<div class="f"><div class="ic">${f[0]}</div><div><b>${f[1]}</b><small>${f[2]}</small></div></div>`).join('')}</div>
    <div class="plans">${PPLANS.map(x=>`<div class="plan ${x.id===pplan?'sel':''}" onclick="pplan='${x.id}';renderPremium()">${x.badge?`<div class="bdg">${x.badge}</div>`:''}<b>${x.t}</b><span>${x.stars}⭐</span></div>`).join('')}</div>
    <div class="pay best" onclick="payAdmin()"><div class="bb">Tavsiya</div><div class="nm">💳 Karta orqali (admin)</div><div class="pr"><b>${fmt(p.som)} so'm</b><small>qo'lda tasdiq</small></div></div>
    <div class="pay" onclick="pay('Click')"><div class="nm">🔵 Click orqali to'lash</div><div class="pr"><b>${fmt(p.som)} so'm</b><small>≈ ${fmt(perday)} so'm/kun</small></div></div>
    <div class="pay" onclick="pay('Payme')"><div class="nm">🟦 Payme orqali to'lash</div><div class="pr"><b>${fmt(p.som)} so'm</b><small>≈ ${fmt(perday)} so'm/kun</small></div></div>
    <div class="pay" onclick="buyStars('prem${pplan}')"><div class="nm">⭐ Telegram Stars bilan</div><div class="pr"><b>${p.stars} ⭐</b></div></div>
    <button class="notnow" onclick="closeSheet('premiumSheet')">Hozir emas</button>`;
}
const BOOST=[{id:'1',t:"1 soat",stars:99,som:19900},{id:'6',t:"6 soat",stars:149,som:29900,badge:"Foydaliroq"}];
let bsel='1';
function openBoost(){document.getElementById('boostSheet').classList.add('on');renderBoost();}
function renderBoost(){
  const b=BOOST.find(x=>x.id===bsel);
  document.getElementById('boostPanel').innerHTML=`
    <div class="grip"></div><div class="crown">⚡</div>
    <h1 style="color:var(--gold)">Anketani yuqoriga ko'tarish</h1>
    <div class="sublt">Sizni <b style="color:var(--text)">5 baravar ko'p odam</b> ko'radi.<br>Ko'proq ko'rsatish — ko'proq layk</div>
    <div class="boostopt">${BOOST.map(x=>`<div class="o ${x.id===bsel?'sel':''}" onclick="bsel='${x.id}';renderBoost()">${x.badge?`<div class="bdg">${x.badge}</div>`:''}<div class="ic">⚡</div><div class="h">${x.t}</div><div class="st">${x.stars} Stars</div><div class="sm">${fmt(x.som)} so'm</div></div>`).join('')}</div>
    <button class="gbtn" style="width:100%" onclick="buyStars('boost${bsel}')">${b.t}ga ko'tarish — ${b.stars} ⭐</button>
    <button class="notnow" onclick="closeSheet('boostSheet')">Hozir emas</button>`;
}
function closeSheet(id){document.getElementById(id).classList.remove('on');}
function pay(method){
  const msg="Bu to'lov usuli ("+method+") server o'rnatilgach ulanadi. Hozircha Telegram Stars bilan to'lang ⭐";
  tg.showPopup?tg.showPopup({title:"To'lov",message:msg,buttons:[{type:'ok'}]}):alert(msg);
}
async function payAdmin(){
  try{await api('/api/request_premium',{method:'POST',body:JSON.stringify({plan:pplan})});}catch(e){}
  const un=ADMIN_USERNAME;
  const msg="Karta orqali to'lash:\n1) @"+un+" ga yozing (so'rovingiz yuborildi)\n2) Admin karta raqamini beradi\n3) Pulni o'tkazib, chekni yuboring\n4) Admin sizga Premium beradi ✅";
  if(tg.showPopup){tg.showPopup({title:"Karta orqali",message:msg,buttons:[{id:'go',type:'default',text:"Adminga yozish"},{type:'cancel'}]},id=>{if(id==='go')openAdminChat(un);});}
  else{alert(msg);openAdminChat(un);}
}
function openAdminChat(un){closeSheet('premiumSheet');tg.openTelegramLink?tg.openTelegramLink('https://t.me/'+un):window.open('https://t.me/'+un);}
async function buyStars(product){
  const r=await api('/api/invoice',{method:'POST',body:JSON.stringify({product})});
  if(!r||!r.link){alert("To'lovni yaratib bo'lmadi"+(r&&r.detail?': '+r.detail:''));return;}
  if(!tg.openInvoice){alert("Telegram versiyangiz Stars to'lovini qo'llamaydi — ilovani yangilang.");return;}
  tg.openInvoice(r.link,(status)=>{
    if(status==='paid'){closeSheet('premiumSheet');closeSheet('boostSheet');toast("👑 Faollashди!");setTimeout(()=>{loadProfile();refreshBadge();},1200);}
    else if(status==='failed')toast("To'lov amalga oshmadi");
  });
}

/* ===== PROFIL TAHRIRLASH ===== */
const E_PETS=["Yo'q","Mushuk","It","Boshqa"];
const E_HABITS=["Yo'q","Ba'zan","Doim"];
const E_SPORT=["Har kuni","Ba'zan","Yo'q"];
const E_EDU=["O'rta","Kollej","Bakalavr","Magistr","Doktorantura"];
const E_FAMILY=["Farzand xohlayman","Xohlamayman","Hali bilmayman"];
const E_COMM=["Tez-tez yozaman","Qo'ng'iroqni afzal ko'raman","Kamdan-kam"];
const E_INTERESTS=["Sayohat","Musiqa","Kino","Kitob","Sport","Oshpazlik","Rasm","O'yinlar","Fotografiya","Raqs","Fitnes","Tabiat","Hayvonlar","Texnologiya","Moda","Til o'rganish"];
const E_GOALS=["Jiddiy munosabatlar","Nikoh va oila","Flirt va uchrashuvlar","Muloqot va do'stlik","Hali aniqlanmaganman"];
let E=null,EID=null,EMediaRaw=[];

async function openEdit(){
  const d=await api('/api/me');if(!d.registered)return;
  const p=d.me;EID=p.id;EMediaRaw=p.media_raw||[];
  E={name:p.name||'',about:p.about||'',city:p.city||'Toshkent',age:p.age||null,goal:p.goal||'',height:p.height||'',
     pref_age_min:p.pref_age_min||18,pref_age_max:p.pref_age_max||30,interests:Array.isArray(p.interests)?p.interests.slice():[],
     pets:p.pets||'',habits:p.habits||'',sport:p.sport||'',education:p.education||'',family:p.family||'',comm:p.comm||'',gender:p.gender,
     photos:EMediaRaw.map((m,i)=>({type:'existing',idx:i}))};
  document.getElementById('editv').classList.add('on');
  renderEdit();
}
function closeEdit(){document.getElementById('editv').classList.remove('on');loadProfile();}
function editPct(){let s=0;if(E.photos.length)s+=25;if(E.photos.length>1)s+=5;if(E.about&&E.about.length>=10)s+=20;if(E.interests.length)s+=10;if(E.goal)s+=10;if(E.height)s+=5;if(E.pets)s+=5;if(E.sport)s+=5;if(E.education)s+=5;if(E.family)s+=5;if(E.comm)s+=5;return Math.min(100,s);}
function ev(val,pct){return val?`<div class="ev">${esc(String(val))}</div>`:`<div class="ev miss">Qo'shish<span class="pctb">+${pct}%</span></div>`;}
function erow(icon,label,valHtml,fn){return `<div class="erow" onclick="${fn}"><div class="ei">${icon}</div><div class="ek">${label}</div>${valHtml}<div class="ea">›</div></div>`;}
function reEdit(){const a=document.getElementById('e_about');if(a)E.about=a.value;const n=document.getElementById('e_name');if(n)E.name=n.value;renderEdit();}
function renderEdit(){
  const pct=editPct();
  document.getElementById('editBody').innerHTML=`
    <div class="eprog"><div class="r"><span>Profil to'ldirilgan</span><b>${pct}%</b></div><div class="bar"><i style="width:${pct}%"></i></div></div>
    <div class="sec">Rasmlar ${E.photos.length<2?'<span class="pctb">+5%</span>':''}</div>
    <div class="ephotos" id="ephotosWrap"></div>
    <div class="hint2">Birinchi rasm — asosiy. "Asosiy qilish" bilan tartibni o'zgartir.</div>
    <div class="sec">O'zingiz haqingizda ${(!E.about||E.about.length<10)?'<span class="pctb">+25%</span>':''}</div>
    <textarea class="einp" id="e_about" maxlength="400" placeholder="O'zingiz haqingizda biroz aytib bering...">${esc(E.about)}</textarea>
    <div class="hint2">Telefon raqami, havola, username, so'kinish va reklama yozmang.</div>
    <div class="sec">Tafsilotlar</div>
    ${erow('📏',"Bo'y, sm",ev(E.height?E.height+' sm':'',5),'pickHeight()')}
    <div class="sec">Sherikning yoshi — <span id="e_arange" style="color:var(--gold)">${E.pref_age_min}–${E.pref_age_max}</span></div>
    <div class="rng"><span class="lab">18</span><input type="range" id="e_amin" min="18" max="65" value="${E.pref_age_min}" oninput="eArange()"><span class="lab">65</span></div>
    <div class="rng"><span class="lab">18</span><input type="range" id="e_amax" min="18" max="65" value="${E.pref_age_max}" oninput="eArange()"><span class="lab">65</span></div>
    <div class="sec">Qiziqishlar va maqsad</div>
    ${erow('★','Qiziqishlar',ev(E.interests.length?E.interests.length+' ta':'',10),'pickInterests()')}
    ${erow('♡','Tanishuv maqsadi',ev(E.goal,10),'pickGoal()')}
    <div class="sec">Turmush tarzi</div>
    ${erow('🐾','Uy hayvonlari',ev(E.pets,5),'pickPets()')}
    ${erow('🍷','Zararli odatlar',ev(E.habits,2),'pickHabits()')}
    ${erow('🏃','Sport',ev(E.sport,5),'pickSport()')}
    <div class="sec">Men haqimda ko'proq</div>
    ${erow('🎓',"Ta'lim",ev(E.education,5),'pickEdu()')}
    ${erow('👪','Oilaviy rejalar',ev(E.family,3),'pickFamily()')}
    ${erow('💬','Muloqot uslubi',ev(E.comm,3),'pickComm()')}
    <div class="sec">Asosiy</div>
    <div class="fld"><label>Ism</label><input class="einp" id="e_name" maxlength="40" value="${esc(E.name)}"></div>
    ${erow('🎂',"Tug'ilgan sana",ev(E.age?E.age+' yosh':'',0),'pickYear()')}
    <div class="fld"><label>Jins (o'zgartirib bo'lmaydi)</label><div class="glock">${E.gender==='qiz'?'Ayol':'Erkak'}</div></div>
    ${erow('📍','Shahar',ev(E.city,0),'pickCity()')}`;
  renderPhotoGrid();
}
function eArange(){let a=+document.getElementById('e_amin').value,b=+document.getElementById('e_amax').value;if(a>b){const t=a;a=b;b=t;}document.getElementById('e_arange').textContent=a+"–"+b;E.pref_age_min=a;E.pref_age_max=b;}

/* --- picker (pastdan chiqadigan tanlagich) --- */
let _pickOpts=[],_pickCb=null;
function openPicker(title,opts,cur,cb){_pickOpts=opts.map(String);_pickCb=cb;
  document.getElementById('pickerPanel').innerHTML=`<div class="grip"></div><div class="psh">${esc(title)}</div>`+
    _pickOpts.map((o,i)=>`<div class="pick ${o===String(cur)?'sel':''}" onclick="pickChoose(${i})">${esc(o)}${o===String(cur)?' ✓':''}</div>`).join('')+
    `<button class="notnow" onclick="closeSheet('pickerSheet')">Yopish</button>`;
  document.getElementById('pickerSheet').classList.add('on');}
function pickChoose(i){closeSheet('pickerSheet');const v=_pickOpts[i];if(_pickCb)_pickCb(v);}
let _mOpts=[],_mSel=[],_mTitle='',_mCb=null;
function openMulti(title,opts,selected,cb){_mOpts=opts.slice();_mSel=selected.slice();_mTitle=title;_mCb=cb;renderMulti();document.getElementById('pickerSheet').classList.add('on');}
function renderMulti(){document.getElementById('pickerPanel').innerHTML=`<div class="grip"></div><div class="psh">${esc(_mTitle)} <span style="color:var(--muted);font-size:15px">(${_mSel.length})</span></div><div class="chips" style="margin-bottom:18px">`+_mOpts.map((o,i)=>`<div class="chip ${_mSel.includes(o)?'on':''}" onclick="mTog(${i})">${esc(o)}</div>`).join('')+`</div><button class="gbtn" style="width:100%" onclick="mDone()">Tayyor</button>`;}
function mTog(i){const o=_mOpts[i];const k=_mSel.indexOf(o);if(k>=0)_mSel.splice(k,1);else if(_mSel.length<10)_mSel.push(o);renderMulti();}
function mDone(){closeSheet('pickerSheet');if(_mCb)_mCb(_mSel.slice());}
/* --- har bir maydon uchun --- */
function pickHeight(){const o=[];for(let h=140;h<=210;h++)o.push(h+' sm');openPicker("Bo'y",o,E.height?E.height+' sm':'',v=>{E.height=parseInt(v);reEdit();});}
function pickYear(){const y=new Date().getFullYear();const o=[];for(let yr=y-14;yr>=y-70;yr--)o.push(yr+' ('+(y-yr)+' yosh)');const cur=E.age?((y-E.age)+' ('+E.age+' yosh)'):'';openPicker("Tug'ilgan yil",o,cur,v=>{E.age=y-parseInt(v);reEdit();});}
function pickCity(){openPicker('Shahar',CITIES,E.city,v=>{E.city=v;reEdit();});}
function pickGoal(){openPicker('Tanishuv maqsadi',E_GOALS,E.goal,v=>{E.goal=v;reEdit();});}
function pickPets(){openPicker('Uy hayvonlari',E_PETS,E.pets,v=>{E.pets=v;reEdit();});}
function pickHabits(){openPicker('Zararli odatlar',E_HABITS,E.habits,v=>{E.habits=v;reEdit();});}
function pickSport(){openPicker('Sport',E_SPORT,E.sport,v=>{E.sport=v;reEdit();});}
function pickEdu(){openPicker("Ta'lim",E_EDU,E.education,v=>{E.education=v;reEdit();});}
function pickFamily(){openPicker('Oilaviy rejalar',E_FAMILY,E.family,v=>{E.family=v;reEdit();});}
function pickComm(){openPicker('Muloqot uslubi',E_COMM,E.comm,v=>{E.comm=v;reEdit();});}
function pickInterests(){openMulti('Qiziqishlar',E_INTERESTS,E.interests,arr=>{E.interests=arr;reEdit();});}
function epSrc(x){return x.type==='new'?x.url:`/photo/${EID}/${x.idx}`;}
function renderPhotoGrid(){
  let h='';E.photos.forEach((x,i)=>{h+=`<div class="epslot filled"><img src="${epSrc(x)}"><span class="num">${i+1}</span><button class="x" onclick="epRemove(${i})">✕</button>${i===0?'<div class="main">Asosiy</div>':`<div class="main" style="background:rgba(0,0,0,.55);color:#fff" onclick="epMain(${i})">Asosiy qilish</div>`}</div>`;});
  if(E.photos.length<6)h+=`<div class="epslot" onclick="document.getElementById('editFile').click()">+</div>`;
  document.getElementById('ephotosWrap').innerHTML=h;
}
function epRemove(i){E.photos.splice(i,1);renderPhotoGrid();}
function epMain(i){const it=E.photos.splice(i,1)[0];E.photos.unshift(it);renderPhotoGrid();}
document.getElementById('editFile').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{const url=await uploadPhoto(f);E.photos.push({type:'new',url:url});renderPhotoGrid();}
  catch(err){toast("Rasm yuklanmadi: "+err.message);}
});
async function saveEdit(){
  const a=document.getElementById('e_about');if(a)E.about=a.value.trim();
  const n=document.getElementById('e_name');if(n)E.name=n.value.trim();
  let amin=+document.getElementById('e_amin').value,amax=+document.getElementById('e_amax').value;if(amin>amax){const t=amin;amin=amax;amax=t;}E.pref_age_min=amin;E.pref_age_max=amax;
  const media=E.photos.map(x=>x.type==='new'?{type:'photo',url:x.url}:EMediaRaw[x.idx]);
  const btn=document.querySelector('.esave .gbtn');if(btn){btn.textContent="Saqlanmoqda...";btn.disabled=true;}
  const r=await api('/api/update_profile',{method:'POST',body:JSON.stringify({
    name:E.name,about:E.about,city:E.city,age:E.age,goal:E.goal,height:E.height,
    pref_age_min:E.pref_age_min,pref_age_max:E.pref_age_max,interests:E.interests,
    pets:E.pets,habits:E.habits,sport:E.sport,education:E.education,family:E.family,comm:E.comm,media:media})});
  if(btn){btn.textContent="Saqlash";btn.disabled=false;}
  if(r&&r.ok){tg.showPopup?tg.showPopup({message:"Saqlandi ✅"}):alert("Saqlandi ✅");closeEdit();}
  else alert("Xato: "+(r&&r.error||"qayta urining"));
}

function showErr(m){try{var d=document.getElementById('deck');if(d)d.innerHTML='<div class="empty"><div class="em">⚠️</div><div style="color:var(--text);font-size:14px;padding:0 18px">'+m+'</div><div style="color:var(--muted);font-size:12px;margin-top:8px">initData: '+(INIT?('bor, '+INIT.length+' belgi'):'YO\'Q (Telegram tashqarisida?)')+'</div></div>';}catch(e){}}
window.addEventListener('error',ev=>showErr('JS xato: '+ev.message));
window.addEventListener('unhandledrejection',ev=>showErr('Promise xato: '+(ev.reason&&ev.reason.message||ev.reason)));
(async()=>{try{await refreshBadge();}catch(e){}try{await loadFeed();}catch(e){showErr('loadFeed: '+(e&&e.message||e));}})();
</script>
</body>
</html>
